# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Kinnim in Lean"
  description: >-
    A Lean 4 formalization of all sixteen units of Mishnah Kinnim, with a
    machine-checked physical optimization theorem for the Koppel--Reiss
    reading of Kinnim 3:2. For any list of pair counts grouped by owner, the
    priest has already acted on exactly half of the mixed birds above and half
    below. A physical world records one action level for every individual bird
    of every owner. Lean proves that every such world is compatible, by
    permutation, with the fixed half-split action list. Counting valid birds
    directly from each owner's closed-pair quota, the theorem proves that the
    exact minimum over all physical apportionments is twice the complement of
    the largest attainable subset sum not exceeding half the total, and
    constructs an apportionment attaining it. The repository also covers all
    sixteen units, flight recurrences, and replacement-inventory covers.
  authors:
    - "Aryeh Shebson"
  license: "MIT"
  responsible_maintainers:
    - "Aryeh Shebson"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05A17", "90C27"]

sources:
  - title: "Seder Kinnim: A Mathematical Commentary on Tractate Kinnim"
    authors:
      - "Moshe Koppel"
    type: "book"
    location: "https://u.cs.biu.ac.il/~koppel/JewishStuff.html"
    relationship: "formalizes"
    note: >-
      The repository follows Koppel's 4 + 6 + 6 division and formalizes his
      generalized smallest-majority interpretation of Kinnim 3:2.
    license: "unknown"
    author_endorsement: "no-response"
  - title: "A Mathematical Proof of Kinnim 3:2"
    authors:
      - "Philip Reiss"
    id: "doi:10.2307/40914641"
    type: "paper"
    location: "https://doi.org/10.2307/40914641"
    relationship: "formalizes"
    note: >-
      Reiss gives a published proof of the same largest-minority /
      smallest-majority result and credits Koppel's equivalent algebraic
      argument.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The repository represents every unit of Mishnah Kinnim and proves the
    Kinnim 3:2 optimization result at substantially greater depth than the
    other units. The Comparator challenge records the direct physical theorem:
    compatibility of complete per-owner individual-bird assignments with the
    fixed action list, a universal smallest-majority lower bound, and a
    concrete assignment attaining it. Several
    other units begin from documented interpretive rules encoded as definitions; Lean
    proves their consequences but does not establish that those rules are the
    uniquely correct readings of the Hebrew source. This is a formal model,
    not a ruling for practice.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "PalomarKinnim.physicalApportionmentExactMinimum"
    - "Kinnim.mishnah_3_2"
    - "Kinnim.generalized_smallest_majority_no_better"

automation:
  methods:
    - method: "agent"
      models: []
      framework: "OpenAI Codex and ChatGPT"
      tool_setup: >-
        AI agents drafted and iteratively strengthened the Lean development;
        Lean's kernel and repeated lake builds checked every committed proof.
      cost:
        wall_time: "several interactive sessions"
        spend_usd: "subscription-based; not tracked"
        hardware: "local machine and hosted agents"
      prompting_notes: >-
        The human specified the corpus and requested the full tractate. Agents
        gathered source mappings, designed the model, proved the results, and
        responded to repeated requests to replace encoded conclusions with
        operational semantics and adversarial optimality proofs.
  spend_usd: "subscription-based; not tracked"
  notes: >-
    Human-directed, AI-assisted formalization. Coherent milestones were built,
    reviewed for sorry/custom axioms, and merged through GitHub pull requests.

fidelity:
  divergences: >-
    The compared theorem formalizes Reiss's optimization domain directly:
    complete owner-by-owner assignments of individual birds to the two action
    levels, with exactly half above globally. It names levels and closed-pair
    quotas rather than the full ritual vocabulary. Global temporal
    interleaving is quotiented by permutation; Lean proves compatibility with
    the concrete fixed action list and proves that owner-level reordering
    cannot affect the valid-bird count. Other
    known textual-to-model boundaries are enumerated in SOURCES.md.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The author and AI agents checked statement/source alignment, compiled the
    full project repeatedly, searched for sorry/admit/custom axioms, and
    strengthened the central proof from aggregate arithmetic to physical
    ownership worlds. Moshe Koppel was sent a source archive for interpretive
    review; no response had been incorporated at submission time.

alignment:
  namespace: "PalomarKinnim"
  statements:
    - source: "Mishnah Kinnim 3:2; Koppel, Seder Kinnim; Reiss (2000), pp. 58--75"
      lean: "PalomarKinnim.physicalApportionmentExactMinimum"
      module: "Solution"
      status: "proved"
      note: >-
        States that every complete per-owner individual-bird apportionment is
        compatible by permutation with the fixed half-split action list, that
        its direct valid-bird count is at least twice the complementary largest
        attainable minority, and that an explicit physical apportionment
        attains this bound exactly.

acknowledgements: >-
  Lean 4, the Lean community, Mechon Mamre and Sefaria for public source text,
  Moshe Koppel and Philip Reiss for the mathematical interpretation, and
  OpenAI's Codex and ChatGPT agents for implementation assistance.
